spring.application.name=peerprep

# H2 in-memory DB for local dev/demo. Swap to MySQL/Postgres by changing these 4 lines for production.
spring.datasource.url=jdbc:h2:mem:peerprepdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=peerprepSecretKeyForDevOnlyChangeInProd123456789
app.jwt.expiration-ms=86400000

server.port=8080
